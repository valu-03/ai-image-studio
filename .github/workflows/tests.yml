name: Tests

# Runs every suite tests/run_all.py knows about - no test framework, no real
# API calls (every provider is mocked, see tests/mock_api.py/mock_elevenlabs.py),
# Qt runs offscreen so nothing needs a display. See tests/run_all.py's own
# docstring for what "every suite" means.
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # PyQt6's "offscreen" platform plugin still dynamically links several
      # X11/EGL/DBus shared libraries at import time even though it never
      # opens a real display - a bare ubuntu-latest runner is missing all of
      # them, and the failure mode is an import-time crash, not a graceful
      # fallback. Found by actually running this on a fresh runner, the same
      # way AIVideoStudio.spec's own header describes finding its `uuid`
      # hidden-import gap - not by reading PyQt6's docs.
      - name: Install Qt's offscreen platform runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxi6 libxrender1 libfontconfig1
          # Renamed libasound2 -> libasound2t64 in Ubuntu 24.04's time_t
          # transition; try the current runner's name first so this does not
          # silently stop installing anything the day ubuntu-latest moves on.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
            || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Record what actually ran. A suite that passes on a developer's machine
      # and fails here differs by exactly two things - the OS and these
      # versions - so printing them turns "green locally, red on CI" from a
      # guessing game into a diff.
      - name: Record the environment
        run: |
          python -VV
          python -c "import PyQt6.QtCore as c; print('Qt', c.QT_VERSION_STR, 'PyQt', c.PYQT_VERSION_STR)"
          fc-list | wc -l | xargs echo "fonts installed:"

      # The job log needs authentication to read; check ANNOTATIONS do not.
      # So on failure the failing lines are re-emitted as an ::error::
      # annotation, which makes them visible on the commit and in the API
      # without anyone downloading a log. %0A is how a workflow command
      # encodes a newline inside a single annotation.
      - name: Run every suite
        run: |
          set +e
          python tests/run_all.py > suite.log 2>&1
          status=$?
          cat suite.log
          if [ "$status" -ne 0 ]; then
            detail=$(grep -E "^ +FAIL|[1-9][0-9]* failed|\(exit [0-9]+\)|Traceback|^[A-Za-z_.]*Error" suite.log \
              | head -40 \
              | sed 's/%/%25/g' \
              | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Failing suites::${detail}"
          fi
          exit $status
